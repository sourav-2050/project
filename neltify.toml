 [build]
  command = "cd client-side && npm install && npm run build"
  publish = "client-side/dist"
  functions = "netlify/functions"

# Exact /users route (GET /users, POST /users)
[[redirects]]
  from = "/users"
  to = "/.netlify/functions/api/users"
  status = 200

# Sub-routes under /users (e.g. /users/123)
[[redirects]]
  from = "/users/*"
  to = "/.netlify/functions/api/users/:splat"
  status = 200

# Admin routes (e.g. /admin/login)
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api/admin"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api/admin/:splat"
  status = 200

# Frontend React Router Single Page App (SPA) Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
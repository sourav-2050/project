[build]
  command = "cd client-side && npm install && npm run build"
  publish = "client-side/dist"
  functions = "netlify/functions"

# API Route Redirects
[[redirects]]
  from = "/users"
  to = "/.netlify/functions/api/users"
  status = 200

[[redirects]]
  from = "/users/*"
  to = "/.netlify/functions/api/users/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api/admin/:splat"
  status = 200

# Frontend Single Page Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200